name: Build and release

# For releases published by hand on the Releases page (tag like v1.3.0):
# builds ImageShrinker.exe with that version and attaches it.
# The "New release" workflow does all of this in one step and is the easier way.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Work out the version number
        id: v
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          V="${TAG#v}"; V="${V#V}"
          if ! [[ "$V" =~ ^[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}$ ]]; then
            echo "::error::The release tag must look like v1.3.0 (got '$TAG')"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  attach:
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ImageShrinker-${{ needs.version.outputs.version }}
          path: out

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          V: ${{ needs.version.outputs.version }}
        run: gh release upload "$TAG" out/ImageShrinker.exe "out/ImageShrinker-$V.zip" out/SHA256SUMS.txt --clobber --repo "$REPO"
